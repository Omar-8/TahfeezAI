# iOS on GitHub's Mac runners (docs/IOS.md): builds the Mushaf engine for
# iOS, compiles the app for an iPhone (unsigned) and for the simulator,
# and runs the smoke test there (integration_test/ios_smoke_test.dart),
# keeping its screenshots and logs. No signing: nothing here installs on a
# real iPhone.
name: iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'packages/tahfeez_ios/**'
      - 'third_party/qvp_flutter/**'
      - 'integration_test/ios_smoke_test.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # The newest Xcode on the runner: plugins use the iOS 26 SDK
      # (connectivity_plus: NWPath.isUltraConstrained).
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Rust targets cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-qvp-v0.2.2

      - name: Mushaf engine (qvp_ffi.xcframework from quran-engine v0.2.2)
        run: bash third_party/qvp_flutter/scripts/build-engine-ios.sh

      - name: Dependencies and generated code
        run: |
          flutter pub get
          # *.g.dart / *.freezed.dart are not committed (.gitignore).
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      # Assets kept out of git until their redistribution is cleared
      # (.gitignore): rebuilt here exactly as on a developer's machine.
      - name: Quran data cache
        uses: actions/cache@v4
        with:
          path: |
            tool/quran_data/.cache
            assets/quran/quran_engine
          key: quran-data-${{ hashFiles('tool/quran_data/**/*.dart', 'tool/quran_engine/fetch_page_data.sh') }}

      - name: Mushaf pages (Quran Engine v0.3.0 data, SHA-256 checked) and layout
        run: |
          [ -f assets/quran/quran_engine/pages/604.qvp ] || bash tool/quran_engine/fetch_page_data.sh --all
          [ -d tool/quran_data/.cache ] || dart run tool/quran_data/fetch_sources.dart
          dart run tool/quran_data/build_production_data.dart

      # Unsigned, with xcodebuild itself: `flutter build ios --no-codesign`
      # still asks for a team, and hides the compiler's errors.
      - name: iPhone build (release, unsigned) — compiles the Swift and links the engine
        shell: bash
        run: |
          flutter build ios --config-only --release --no-codesign
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build > ../xcodebuild.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" ../xcodebuild.log | sort -u | head -80 || true
          exit ${status:-0}

      - name: Simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, ds in devices.items() if 'iOS' in runtime
                    for d in ds if d['name'].startswith('iPhone')]
          print(phones[-1]['udid'])")
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Smoke test on the simulator
        shell: bash  # -eo pipefail: the test's failure is not hidden by tee
        run: |
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/ios_smoke_test.dart \
            -d "${{ steps.sim.outputs.udid }}" 2>&1 | tee smoke.log

      - name: Simulator log
        if: always()
        run: |
          xcrun simctl spawn booted log show --last 15m --style compact \
            --predicate 'process == "Runner"' > simulator.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-smoke
          path: |
            screenshots/
            smoke.log
            simulator.log
            xcodebuild.log
          if-no-files-found: warn
