# The App Store's screenshots and app previews, run by hand:
#
# - on an iPhone 6.9", an iPad 13" and (when the runner's Xcode has one) an
#   iPhone Duo simulator: the store screenshot test
#   (integration_test/store_screenshots_test.dart), then the app preview
#   tour (integration_test/app_preview_test.dart) recorded from the screen;
# - on Linux (the Noto fonts for Bengali and Cyrillic, ffmpeg): the shots
#   framed with captions at every App Store size in every listing language
#   (tool/make_app_store_images.py), the recordings cut and encoded as
#   Apple asks (886 x 1920 for iPhone and Duo, 1200 x 1600 for iPad; 30 fps
#   H.264, stereo AAC, 15–30 s).
#
# The results are this run's artifact "app-store-media".
name: iOS screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ios-setup
        with:
          qul-sources-key: ${{ secrets.QUL_SOURCES_KEY }}
          github-token: ${{ github.token }}

      - name: Screenshots and previews
        shell: bash
        timeout-minutes: 130
        run: |
          set -o pipefail
          now() { perl -MTime::HiRes=time -e 'printf "%.3f\n", time'; }
          stamp() { perl -MTime::HiRes=time -ne '$|=1; printf "%.3f %s", time, $_'; }
          # A device type: the first of $2.. (exact names; ones known to work
          # with flutter drive — on the iPhone 17 Pro Max it never attached)
          # on the runner, else the newest whose name has $1; newest iOS.
          pick() {
            xcrun simctl list -j | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)
          runtime = [r for r in data['runtimes'] if r['platform'] == 'iOS' and r['isAvailable']][-1]
          types = [t for t in data['devicetypes'] if sys.argv[1] in t['name']]
          if not types:
              sys.exit(1)
          by_name = {t['name']: t for t in types}
          preferred = [by_name[n] for n in sys.argv[2:] if n in by_name]
          # The newest by the numbers in its name (iPhone 17 > 11, M5 > M4).
          chosen = preferred[0] if preferred else max(
              types, key=lambda t: [int(n) for n in re.findall(r'\\d+', t['name'])])
          print(chosen['identifier'], runtime['identifier'])" "$@"
          }
          # At most [seconds] for a command (a hung flutter drive otherwise
          # holds the whole step until its time-out).
          limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
          mkdir -p shots previews
          for device in iphone ipad duo; do
            case $device in
              iphone) found=$(pick "Pro Max" "iPhone 16 Pro Max" "iPhone 17 Pro Max") ;;
              ipad) found=$(pick "iPad Pro 13-inch" "iPad Pro 13-inch (M4)") ;;
              duo) found=$(pick "iPhone Duo") ;;
            esac
            if [ -z "$found" ]; then
              echo "::warning::No $device simulator on this runner: skipped"
              continue
            fi
            read -r type runtime <<< "$found"
            udid=$(xcrun simctl create "store-$device" "$type" "$runtime")
            echo "== $device: $type on $runtime ($udid)"
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 \
              --dataNetwork wifi --wifiBars 3 --cellularBars 4 \
              --batteryState charged --batteryLevel 100

            rm -rf screenshots
            limit 1500 flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/store_screenshots_test.dart \
              -d "$udid" 2>&1 | tee "shots-$device.log" || echo "::warning::$device screenshots failed"
            [ -d screenshots ] && mv screenshots "shots/$device"

            # The tour, recorded; its start and end lines timed against the
            # recording's start, for the cut.
            xcrun simctl io "$udid" recordVideo --codec=h264 --force "previews/$device.mov" &
            recorder=$!
            sleep 2
            started=$(now)
            limit 1500 flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/app_preview_test.dart \
              -d "$udid" 2>&1 | stamp | tee "preview-$device.log" || echo "::warning::$device preview failed"
            kill -INT $recorder
            wait $recorder || true
            python3 - "$device" "$started" <<'EOF'
          import json, sys
          device, started = sys.argv[1], float(sys.argv[2])
          marks = {}
          for line in open(f'preview-{device}.log', errors='replace'):
              for mark in ('start', 'end'):
                  if f'app-preview: {mark}' in line:
                      marks[mark] = round(float(line.split()[0]) - started + 2, 2)
          json.dump(marks, open(f'previews/{device}.json', 'w'))
          print(device, marks)
          EOF
            xcrun simctl shutdown "$udid"
          done
          python3 -c "
          from pathlib import Path
          import struct
          for f in sorted(Path('shots').rglob('*.png')):
              w, h = struct.unpack('>II', f.read_bytes()[16:24])
              print(f, w, 'x', h)"
          ls -la previews

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-raw-captures
          path: |
            shots/
            previews/
            shots-*.log
            preview-*.log

  finish:
    needs: capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ios-raw-captures
          path: raw
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq fonts-noto-core python3-pil ffmpeg
      - name: Screenshots, framed
        run: python3 tool/make_app_store_images.py raw/shots media/screenshots
      # The tour found in each recording, cut and encoded
      # (tool/cut_app_preview.py).
      - name: App previews
        run: |
          set -e
          mkdir -p media/previews
          for device in iphone ipad duo; do
            [ -f raw/previews/$device.mov ] && [ -f raw/previews/$device.json ] || continue
            if [ $device = ipad ]; then size=1200:1600; else size=886:1920; fi
            python3 tool/cut_app_preview.py raw/previews/$device.mov raw/previews/$device.json \
              media/previews/$device.mp4 $size
            ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate,channels \
              -of compact media/previews/$device.mp4
          done
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-media
          path: media/
