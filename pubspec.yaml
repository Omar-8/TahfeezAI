name: tahfeez_ai
description: "TahfeezAI — an offline-first Quran and memorization app."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^18.0.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  path: ^1.9.1
  logging: ^1.3.0
  shared_preferences: ^2.5.5
  crypto: ^3.0.6
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  dynamic_color: ^1.9.0
  # Overridden below (dependency_overrides) to a local, patched copy —
  # this version constraint is kept in sync with that copy's own
  # provenance (third_party/qvp_flutter/PATCHES.md), not actually
  # resolved from pub.dev while the override is active.
  qvp_flutter: ^0.2.2
  web: ^1.1.1
  record: ^7.1.1
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.1
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  in_app_review: ^2.0.12
  in_app_update: ^5.0.0
  package_info_plus: ^10.2.2
  just_audio_background: ^0.0.1-beta.17
  # Tahfeez's own iOS platform channels (Android's are in android/app).
  tahfeez_ios:
    path: packages/tahfeez_ios

# A locally-vendored, minimally-patched copy of qvp_flutter 0.2.2 —
# exposes QvpViewLayout.maxAspectSlack (already a real, documented,
# already-engine-supported parameter one level down, at QvpLayoutSpec;
# QvpPageView's own convenience layout object just never let a caller
# set it, hard-coding QvpDefaults.aspectSlack/1.15 unconditionally).
# Nothing else about the package is modified — no native code, no other
# behavior. Full provenance, the exact patch, and the removal condition:
# third_party/qvp_flutter/PATCHES.md.
dependency_overrides:
  qvp_flutter:
    path: third_party/qvp_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device checks (e.g. live recognition against a real engine) —
  # never part of the app.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  drift_dev: ^2.35.0
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2

  # Used only by the offline dev tooling under tool/quran_data/ to read the
  # QuranEnc and QUL source .sqlite/.db files when building the bundled
  # production Quran dataset — never used at app runtime. Already present
  # as a transitive dependency of drift; declared directly here because
  # tool/quran_data/ imports it explicitly.
  sqlite3: ^3.5.2

  # Used only by tool/quran_data/ to parse Tanzil's quran-data.xml metadata
  # file — never used at app runtime.
  xml: ^6.6.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Generates lib/core/localization/generated/app_localizations.dart from the
  # .arb files referenced by l10n.yaml. Run `flutter gen-l10n` (or
  # `flutter pub get`) after checkout; the generated output is not committed.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # The bundled production Quran dataset (canonical Tanzil text + metadata,
  # QuranEnc translations/tafsir, and a resource manifest with per-resource
  # provenance hashes) — see docs/QURAN_DATA_PROVENANCE.md and
  # tool/quran_data/build_production_data.dart, which generates these files.
  # Read at first launch by lib/quran/data/import/bundled_dataset_seeder.dart
  # so Android/iOS never need a network call to seed the local databases.
  assets:
    - assets/quran/quran_dataset.json
    # The splash's icon (the launcher icon's foreground, on its own colour).
    - assets/branding/splash_icon.png
    - assets/quran/resource_manifest.json
    - assets/quran/translations/en_rowwad.json
    - assets/quran/translations/de_rowwad.json
    - assets/quran/tafsir/ar_muyassar.json
    # Word meanings (translation milestone T3; licence unverified, owner
    # decision — docs/THIRD_PARTY_RESOURCES.md).
    - assets/quran/wbw/en_qurancom.json
    - assets/quran/wbw/ur_qurancom.json
    - assets/quran/wbw/id_qurancom.json
    - assets/quran/wbw/tr_qurancom.json
    - assets/quran/wbw/fa_qurancom.json
    - assets/quran/wbw/bn_qurancom.json
    - assets/quran/wbw/fr_qurancom.json
    # The translation milestone's launch languages (T4).
    - assets/quran/translations/ur_junagarhi.json
    - assets/quran/translations/id_affairs.json
    - assets/quran/translations/tr_rowwad.json
    - assets/quran/translations/fr_noor.json
    - assets/quran/translations/es_noor.json
    - assets/quran/translations/ru_rowwad.json
    - assets/quran/translations/fa_rowwad.json
    - assets/quran/translations/bn_rowwad.json
    - assets/quran/tafsir/en_mukhtasar.json
    - assets/quran/tafsir/id_mukhtasar.json
    - assets/quran/tafsir/tr_mukhtasar.json
    - assets/quran/tafsir/fr_mukhtasar.json
    - assets/quran/tafsir/es_mukhtasar.json
    - assets/quran/tafsir/ru_mukhtasar.json
    - assets/quran/tafsir/fa_mukhtasar.json
    - assets/quran/tafsir/bn_mukhtasar.json
    - assets/quran/tafsir/ur_ahsanulbayan.json
    # Expected Hafs pronunciation of every ayah for acoustic verification —
    # tool/acoustic_verification/build_reference.py.
    - assets/quran/recitation/phonetic_reference_hafs.json

    # DEVELOPMENT-ONLY, LICENSE-GATED — see docs/QURAN_DATA_PROVENANCE.md
    # §7/§7a/§8 and the release checklist there. This is the Mushaf
    # line/token *structural* dataset (which Surah/Juz a page opens on,
    # word-by-word layout metadata) — independent of which engine actually
    # draws Mushaf page glyphs (Quran Engine, since
    # docs/QURAN_ENGINE_MIGRATION.md) and still consulted for that
    # structural data (e.g. `MushafPageTitle`). The former QPC V2 *font*
    # glyph package this block also used to declare
    # (`assets/quran/manifests/qpc_v2_fonts.json`,
    # `assets/quran/fonts/qpc_v2/`) was removed with that renderer — no
    # code loads it any more. lib/quran/data/import/
    # bundled_dataset_seeder.dart refuses to import this dataset when
    # kReleaseMode is true, so the app itself never displays it in a
    # release build even if these bytes are physically present. That
    # refusal does NOT remove the bytes from a naively-built release
    # package — a true public release must also strip or flavor-gate this
    # asset line before shipping; do not mark the release checklist's
    # redistribution items "cleared" without verified upstream permission.
    - assets/quran/mushaf/kfgqpc_v2.json

    # The verse-by-verse reader is archived (git tag archive/verse-by-verse):
    # neither its code nor its data — the Uthmani Hafs display font and the
    # QPC Hafs display-word manifest — is in the app.

    # Quran Engine's own KFGQPC-derived Mushaf page corpus (the full,
    # real 604-page set — structurally validated by
    # tool/quran_engine/verify_all_pages_structural.mjs), vendored from
    # Quran.ws's CDN release (tool/quran_engine/README.md). Quran Engine
    # is Tahfeez's production Mushaf rendering backend
    # (docs/QURAN_ENGINE_MIGRATION.md) and is now bundled and loaded in
    # every build, including release — by explicit product decision, this
    # corpus is no longer kReleaseMode-gated the way every other block on
    # this page still is. This corpus's public redistribution remains
    # unresolved, exactly like QPC V2's was (a different technical
    # delivery mechanism for material with the same underlying KFGQPC
    # provenance question, not a separate license) — that decision was
    # made deliberately, with that risk understood, not because the
    # provenance question was resolved. See
    # docs/QURAN_ENGINE_MIGRATION.md's licensing section.
    - assets/quran/quran_engine/pages/
    # The on-device acoustic model and its manifest (not in git — see
    # .gitignore); extracted to app storage on Android on first use.
    - assets/models/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Tahfeez's UI typeface (never used for canonical Quran text — see
  # docs/DESIGN_DIRECTION.md's UI/Quran typography separation and
  # docs/THIRD_PARTY_RESOURCES.md for licensing). Both are single-file
  # variable fonts (one file covers every weight via the `wght` axis).
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf
    # Home's Daily Ayah: Quran text (Tanzil Uthmani) — a font designed for
    # it, with full Quranic mark support.
    - family: Scheherazade New
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.ttf
    # Ayah mode's other Quran font (QuranFont), chosen in its view settings.
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
    - family: Lateef
      fonts:
        - asset: assets/fonts/Lateef-Regular.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
    # The Arabic UI fonts, one chosen in Settings (ArabicUiFont).
    - family: Noto Kufi Arabic
      fonts:
        - asset: assets/fonts/NotoKufiArabic-Variable.ttf
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
